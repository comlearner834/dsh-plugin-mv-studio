<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>painted-animation renderer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #100e0c;
  }
  #stage {
    position: relative; overflow: hidden;
    background: #efe4ce;
    transform-origin: top left;
  }
  #stage canvas {
    position: absolute; inset: 0; display: block;
    width: 100%; height: 100%;
  }
  #brush { position: absolute; inset: 0; z-index: 1; }
  #brush canvas { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; }
  #grain { z-index: 2; pointer-events: none; }
  #ink { z-index: 3; pointer-events: none; }
  #boot-error {
    position: fixed; inset: 0; z-index: 99; display: none;
    align-items: center; justify-content: center;
    padding: 40px; background: #160f0c; color: #f4d8c4;
    font: 14px/1.6 ui-monospace, Consolas, monospace;
    white-space: pre-wrap;
  }
</style>
<script src="/vendor/p5.min.js"></script>
<script src="/vendor/p5.brush.js"></script>
</head>
<body>
<div id="stage">
  <div id="brush"></div>
  <canvas id="grain"></canvas>
  <canvas id="ink"></canvas>
</div>
<div id="boot-error"></div>
<script type="module" src="/engine/engine.js"></script>
</body>
</html>
